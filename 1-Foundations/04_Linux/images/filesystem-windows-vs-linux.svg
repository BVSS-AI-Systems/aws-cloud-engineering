<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="998" height="468" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="500" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">File System: Windows vs Linux</text>

  <!-- Windows panel -->
  <rect x="20" y="66" width="450" height="380" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="245" y="96" text-anchor="middle" font-size="19" font-weight="700" fill="#075985">Windows: many roots</text>
  <g font-family="Consolas, Menlo, monospace" text-anchor="middle">
    <rect x="40" y="120" width="125" height="46" rx="10" fill="#0284c7"/><text x="102" y="149" font-size="18" font-weight="700" fill="#fff">C:\</text>
    <rect x="182" y="120" width="125" height="46" rx="10" fill="#0284c7"/><text x="244" y="149" font-size="18" font-weight="700" fill="#fff">D:\</text>
    <rect x="324" y="120" width="125" height="46" rx="10" fill="#0284c7"/><text x="386" y="149" font-size="18" font-weight="700" fill="#fff">E:\ (USB)</text>
  </g>
  <g stroke="#0284c7" stroke-width="2">
    <line x1="102" y1="166" x2="102" y2="200"/><line x1="102" y1="183" x2="102" y2="250"/>
    <line x1="244" y1="166" x2="244" y2="200"/>
    <line x1="386" y1="166" x2="386" y2="200"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#0c4a6e">
    <rect x="45" y="200" width="115" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="102" y="222">Users</text>
    <rect x="45" y="250" width="115" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="102" y="272">Program Files</text>
    <rect x="187" y="200" width="115" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="244" y="222">Data</text>
    <rect x="329" y="200" width="115" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="386" y="222">Photos</text>
  </g>
  <g font-size="15" fill="#334155">
    <text x="45" y="340">• Every disk gets its own drive letter</text>
    <text x="45" y="368">• Paths use backslash  <tspan font-family="Consolas, Menlo, monospace">C:\Users</tspan></text>
    <text x="45" y="396">• Called a <tspan font-weight="700">folder</tspan></text>
  </g>

  <!-- Linux panel -->
  <rect x="490" y="66" width="490" height="380" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="735" y="96" text-anchor="middle" font-size="19" font-weight="700" fill="#713f12">Linux: one single root</text>

  <rect x="700" y="112" width="70" height="44" rx="10" fill="#ca8a04"/>
  <text x="735" y="142" text-anchor="middle" font-size="24" font-weight="800" font-family="Consolas, Menlo, monospace" fill="#fff">/</text>

  <g stroke="#ca8a04" stroke-width="2" fill="none">
    <line x1="735" y1="156" x2="735" y2="176"/>
    <line x1="539" y1="176" x2="931" y2="176"/>
    <line x1="539" y1="176" x2="539" y2="192"/><line x1="617" y1="176" x2="617" y2="192"/><line x1="695" y1="176" x2="695" y2="192"/>
    <line x1="773" y1="176" x2="773" y2="192"/><line x1="851" y1="176" x2="851" y2="192"/><line x1="931" y1="176" x2="931" y2="192"/>
    <line x1="773" y1="226" x2="773" y2="256"/>
    <line x1="851" y1="226" x2="851" y2="316"/>
  </g>
  <g font-size="14" font-family="Consolas, Menlo, monospace" text-anchor="middle" fill="#713f12">
    <rect x="508" y="192" width="62" height="34" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="539" y="214">bin</text>
    <rect x="586" y="192" width="62" height="34" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="617" y="214">boot</text>
    <rect x="664" y="192" width="62" height="34" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="695" y="214">etc</text>
    <rect x="742" y="192" width="62" height="34" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="773" y="214">home</text>
    <rect x="820" y="192" width="62" height="34" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="851" y="214">mnt</text>
    <rect x="900" y="192" width="62" height="34" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="931" y="214">var</text>
    <rect x="718" y="256" width="110" height="34" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="773" y="278">ec2-user</text>
  </g>
  <rect x="776" y="316" width="190" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="871" y="337" text-anchor="middle" font-size="14" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#14532d">usb</text>
  <text x="871" y="356" text-anchor="middle" font-size="12" fill="#166534">USB drive mounted here</text>
  <g font-size="15" fill="#334155">
    <text x="510" y="395">• Extra disks &amp; USBs are mounted under /</text>
    <text x="510" y="423">• Paths use slash <tspan font-family="Consolas, Menlo, monospace">/home/ec2-user</tspan> · a <tspan font-weight="700">directory</tspan></text>
  </g>
</svg>
