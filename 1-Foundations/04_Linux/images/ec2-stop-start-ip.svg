<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="558" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="500" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">AWS EC2: Instance States &amp; Public IP</text>

  <!-- States -->
  <rect x="120" y="100" width="200" height="66" rx="33" fill="#16a34a"/>
  <text x="220" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Running</text>

  <rect x="680" y="100" width="200" height="66" rx="33" fill="#f59e0b"/>
  <text x="780" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Stopped</text>

  <rect x="400" y="228" width="200" height="66" rx="33" fill="#dc2626"/>
  <text x="500" y="259" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Terminated</text>
  <text x="500" y="280" text-anchor="middle" font-size="12" fill="#fee2e2">permanently deleted</text>

  <!-- Stop / Start -->
  <line x1="322" y1="118" x2="676" y2="118" stroke="#475569" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="500" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Stop (default shutdown behaviour)</text>
  <line x1="678" y1="150" x2="324" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="500" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Start</text>

  <!-- Reboot loop -->
  <path d="M175 100 C175 60, 265 60, 265 98" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="220" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Reboot</text>

  <!-- Terminate -->
  <line x1="250" y1="168" x2="410" y2="240" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)"/>
  <line x1="750" y1="168" x2="590" y2="240" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)"/>
  <text x="300" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Terminate</text>
  <text x="700" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Terminate</text>

  <line x1="40" y1="320" x2="960" y2="320" stroke="#e2e8f0" stroke-width="2"/>
  <text x="500" y="352" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">What happens to the Public IP?</text>

  <!-- IP cards -->
  <rect x="40" y="374" width="290" height="150" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="185" y="408" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Reboot</text>
  <text x="185" y="444" text-anchor="middle" font-size="16" font-family="Consolas, Menlo, monospace" fill="#334155">3.110.x.x → 3.110.x.x</text>
  <rect x="105" y="466" width="160" height="34" rx="17" fill="#16a34a"/>
  <text x="185" y="489" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">✓ Same IP</text>

  <rect x="355" y="374" width="290" height="150" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="408" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d">Stop → Start</text>
  <text x="500" y="444" text-anchor="middle" font-size="16" font-family="Consolas, Menlo, monospace" fill="#334155">3.110.x.x → 13.234.y.y</text>
  <rect x="420" y="466" width="160" height="34" rx="17" fill="#dc2626"/>
  <text x="500" y="489" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">✗ IP changes</text>

  <rect x="670" y="374" width="290" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="815" y="408" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Elastic IP (EIP)</text>
  <text x="815" y="444" text-anchor="middle" font-size="15" fill="#334155">static IP attached to the instance</text>
  <rect x="735" y="466" width="160" height="34" rx="17" fill="#2563eb"/>
  <text x="815" y="489" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">✓ Fixed IP</text>

  <text x="500" y="546" text-anchor="middle" font-size="13" fill="#64748b">Need an IP that never changes? Attach an Elastic IP.</text>
</svg>
