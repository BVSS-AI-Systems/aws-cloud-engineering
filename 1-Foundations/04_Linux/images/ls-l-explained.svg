<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="998" height="418" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="500" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Reading <tspan font-family="Consolas, Menlo, monospace">ls -l</tspan> Output</text>

  <rect x="30" y="70" width="940" height="56" rx="10" fill="#0f172a"/>
  <g font-family="Consolas, Menlo, monospace" font-size="22" font-weight="700">
    <text x="50" y="106" fill="#f472b6">-rw-r--r--</text>
    <text x="215" y="106" fill="#94a3b8">1</text>
    <text x="255" y="106" fill="#60a5fa">ec2-user</text>
    <text x="395" y="106" fill="#a78bfa">ec2-user</text>
    <text x="535" y="106" fill="#34d399">4.0K</text>
    <text x="615" y="106" fill="#fbbf24">Nov 21 10:30</text>
    <text x="820" y="106" fill="#ffffff">notes.txt</text>
  </g>

  <g stroke-width="2" fill="none">
    <line x1="116" y1="126" x2="116" y2="160" stroke="#db2777"/>
    <line x1="222" y1="126" x2="222" y2="210" stroke="#64748b"/>
    <line x1="308" y1="126" x2="308" y2="160" stroke="#2563eb"/>
    <line x1="448" y1="126" x2="448" y2="210" stroke="#7c3aed"/>
    <line x1="561" y1="126" x2="561" y2="160" stroke="#059669"/>
    <line x1="694" y1="126" x2="694" y2="210" stroke="#d97706"/>
    <line x1="880" y1="126" x2="880" y2="160" stroke="#0f172a"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="46" y="160" width="140" height="30" rx="15" fill="#fce7f3"/><text x="116" y="180" fill="#9d174d">type + permissions</text>
    <rect x="167" y="210" width="110" height="30" rx="15" fill="#f1f5f9"/><text x="222" y="230" fill="#334155">no. of links</text>
    <rect x="258" y="160" width="100" height="30" rx="15" fill="#dbeafe"/><text x="308" y="180" fill="#1e3a8a">owner</text>
    <rect x="398" y="210" width="100" height="30" rx="15" fill="#ede9fe"/><text x="448" y="230" fill="#5b21b6">group</text>
    <rect x="501" y="160" width="120" height="30" rx="15" fill="#d1fae5"/><text x="561" y="180" fill="#065f46">size (-h = K/M/G)</text>
    <rect x="619" y="210" width="150" height="30" rx="15" fill="#fef3c7"/><text x="694" y="230" fill="#92400e">last modified</text>
    <rect x="820" y="160" width="120" height="30" rx="15" fill="#e2e8f0"/><text x="880" y="180" fill="#0f172a">file name</text>
  </g>

  <line x1="40" y1="268" x2="960" y2="268" stroke="#e2e8f0" stroke-width="2"/>
  <text x="500" y="298" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Breaking down <tspan font-family="Consolas, Menlo, monospace" fill="#db2777">-rw-r--r--</tspan></text>

  <g text-anchor="middle">
    <rect x="130" y="318" width="150" height="76" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <text x="205" y="350" font-size="24" font-weight="800" font-family="Consolas, Menlo, monospace" fill="#0f172a">-</text>
    <text x="205" y="378" font-size="13" fill="#334155">file type (d = dir)</text>

    <rect x="300" y="318" width="170" height="76" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="385" y="350" font-size="24" font-weight="800" font-family="Consolas, Menlo, monospace" fill="#1e3a8a">rw-</text>
    <text x="385" y="378" font-size="13" fill="#1e3a8a">owner (user)</text>

    <rect x="490" y="318" width="170" height="76" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="575" y="350" font-size="24" font-weight="800" font-family="Consolas, Menlo, monospace" fill="#5b21b6">r--</text>
    <text x="575" y="378" font-size="13" fill="#5b21b6">group</text>

    <rect x="680" y="318" width="170" height="76" rx="12" fill="#d1fae5" stroke="#059669"/>
    <text x="765" y="350" font-size="24" font-weight="800" font-family="Consolas, Menlo, monospace" fill="#065f46">r--</text>
    <text x="765" y="378" font-size="13" fill="#065f46">others</text>
  </g>
  <text x="500" y="412" text-anchor="middle" font-size="12" fill="#64748b">r = read · w = write · x = execute · - = not allowed</text>
</svg>
