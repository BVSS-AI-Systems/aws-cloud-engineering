<svg xmlns="http://www.w3.org/2000/svg" width="920" height="270" viewBox="0 0 920 270" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="918" height="268" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="460" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Kernel vs Distribution</text>

  <rect x="25" y="95" width="145" height="90" rx="12" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
  <text x="97" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#713f12">Linux Kernel</text>
  <text x="97" y="158" text-anchor="middle" font-size="13" fill="#854d0e">just the core</text>

  <text x="187" y="148" text-anchor="middle" font-size="30" font-weight="700" fill="#64748b">+</text>

  <rect x="205" y="95" width="130" height="90" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="270" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#312e81">Tools</text>
  <text x="270" y="158" text-anchor="middle" font-size="13" fill="#3730a3">shell, utilities</text>

  <text x="352" y="148" text-anchor="middle" font-size="30" font-weight="700" fill="#64748b">+</text>

  <rect x="370" y="95" width="170" height="90" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="455" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#831843">Package Manager</text>
  <text x="455" y="158" text-anchor="middle" font-size="13" fill="#9d174d">apt · dnf · yum · apk</text>

  <text x="557" y="148" text-anchor="middle" font-size="30" font-weight="700" fill="#64748b">+</text>

  <rect x="575" y="95" width="140" height="90" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="645" y="135" text-anchor="middle" font-size="18" font-weight="700" fill="#164e63">Default Apps</text>
  <text x="645" y="158" text-anchor="middle" font-size="13" fill="#155e75">editor, browser…</text>

  <text x="732" y="148" text-anchor="middle" font-size="30" font-weight="700" fill="#64748b">=</text>

  <rect x="750" y="85" width="150" height="110" rx="14" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <text x="825" y="130" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Distribution</text>
  <text x="825" y="152" text-anchor="middle" font-size="13" fill="#dcfce7">(Distro)</text>
  <text x="825" y="174" text-anchor="middle" font-size="12" fill="#dcfce7">Ubuntu · RHEL · Alpine</text>

  <text x="460" y="240" text-anchor="middle" font-size="14" fill="#64748b">Every distro uses the same Linux kernel; they differ in the tools, package manager and apps around it</text>
</svg>
